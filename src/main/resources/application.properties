spring.application.name=complaint-management-system
server.port=8080

# Default: in-memory H2 so the project runs with no setup.
spring.datasource.url=jdbc:h2:mem:complaint_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
